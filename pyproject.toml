[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "restock-watch"
version = "1.0.0"
description = "A small, self-hosted restock and preorder watcher with transition-aware alerts."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Restock Watch contributors" }]
keywords = ["restock", "inventory", "monitoring", "alerts", "n8n"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP",
]

[project.optional-dependencies]
browser = ["playwright>=1.45,<2"]
dev = ["playwright>=1.45,<2"]

[project.scripts]
restock-watch = "restock_watch.__main__:main"

[project.urls]
Repository = "https://github.com/gaa101704-arch/Restock-Watch"
Issues = "https://github.com/gaa101704-arch/Restock-Watch/issues"

[tool.setuptools.packages.find]
include = ["restock_watch*"]
